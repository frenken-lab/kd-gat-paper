# MLPaper — Vale style derived from paper/STYLE.md
#
# B1–B8 mirror STYLE.md §4 banned LLM tells.
# R4 mirrors STYLE.md §3 R4 hedge-phrase ban.
#
# Each rule cites STYLE.md and links back; the message names which rule
# fired so the writer can find the exemplar/anchor passage and the
# before/after example.
#
# Adding a rule:
#   - Find an exemplar-anchored rule in STYLE.md.
#   - Confirm at least one bite-test passage exists (per STYLE.md §1.3).
#   - Write a rule file here referencing the same STYLE.md section.
#   - Run `make lint` and adjust the regex until the bite-test triggers
#     and a randomly-chosen passing passage does not.
