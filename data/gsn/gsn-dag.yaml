# kd-gat thesis argument as GSN-conformant safety-case structure.
# Schema: GSN_SCHEMA.md (authoritative GSN data model + migration recipe).
# Walker spec + review chain: DAG.md.
#
# Migrated from the home-rolled AND/OR DAG schema on 2026-05-07.
# Element types: Goal / Strategy / Solution / Context (no Assumptions —
# layer:constraint takes precedence over kind:domain_axiom in the mapping).
# Link types: SupportedBy / InContextOf.
# Non-conformant annotations preserved on every element: layer (thesis /
# instance / constraint), instantiates (instance → thesis cross-link),
# formal_object (mathematical-object indicator). GSN tooling ignores these;
# our walker reads them for the layer-aware validation pass.

module:
  id: kdgat-thesis
  description: kd-gat candidacy argument
  history:
    - "2026-05-07a — post DAG_REVIEW: walker fix; N31 demoted; D-N13 added"
    - "2026-05-07b — post CONSTRAINT_INVENTORY: thesis/instance split; constraints lifted to top-level; N31 promoted back to cited_result"
    - "2026-05-07c — added N50 (G3) for per-class abstain-rate bound under class imbalance"
    - "2026-05-07d — migrated to GSN-conformant schema (Goal/Strategy/Solution/Context); layer kept as annotation"
    - "2026-05-07e — audit pass: pruned N27 (orphan); linked N04-instance to S-N02-instance; relocated N04-thesis Solution→Context InContextOf C-thesis; collapsed S-N04-instance (N04-instance promoted Goal→Solution); rewrote N20 with KD-literature citation; expanded K2 with explicit ASIL C/D requirements; caveated C-thesis on missing operational threshold"
    - "2026-05-08 — clarity pass: replaced 'Mondrian' jargon with plain language; merged K2–K4 → K-regulatory and K5–K9 → K-operational; simplified relay-strategy labels; moved N31 to instance layer; replaced opaque ID refs in statements with descriptive names; cleaned V03 and N20 statements"
  scope:
    goals: 12
    strategies: 10
    solutions: 7
    contexts: 4
  critical_paths:
    - nodes: [C-thesis, S-thesis, N02-thesis, S-N02-thesis, N02-instance, S-N02-instance, N01-instance, S-N01-instance, N01-thesis, S-N01-thesis, N03]
      terminus: N03   # undeveloped Goal, gap_id=G1
    - nodes: [C-thesis, S-thesis, N02-thesis, S-N02-thesis, N02-instance, S-N02-instance, N50]
      terminus: N50   # undeveloped Goal, gap_id=G3
  gaps:
    - id: G1
      element: N03
      severity: critical
      remedy: Derive simultaneous fire+suppress on CAN data under independent fitting.
    - id: G3
      element: N50
      severity: major
      remedy: >
        Three options: (a) bound the per-class abstain rate empirically under
        class imbalance and quantify operational impact; (b) replace N17 with a
        pooled-class conformal mechanism with imbalance correction; (c) accept
        the rate explicitly in the candidacy text. Ding et al. (OpenReview
        Dtxc7mlKRg) documents formal instability of classwise conformal
        predictors under heavy imbalance.
  open_strategies:
    - S-thesis           # composition theorem (coverage + compression) at thesis layer
    - S-N02-instance     # composition theorem (per-class abstain + safety shield + joint apparatus + abstain bound)

# ===========================================================================
# ELEMENTS — Goal / Strategy / Solution / Context
# ===========================================================================

elements:

  # ---- Goals ---------------------------------------------------------------

  - id: C-thesis
    type: Goal
    statement: Proposed system delivers operational coverage on automotive IDS — some closed configuration of {orthogonal-channel ensemble, decoupled-approval gate, jointly-fit calibration apparatus, deployable compression} delivers a class-conditional rejection guarantee on the active subset, respecting the applicable hardware, regulatory, and operational constraints. (Caveat — no specific operational success threshold committed yet, e.g. detection-rate floor at a given abstain-rate ceiling on a named dataset; deferred to a content-side authoring pass.)
    undeveloped: false
    layer: thesis

  - id: N02-thesis
    type: Goal
    statement: Operational rejection guarantee — the deployed system has class-conditional coverage on its active subset, distribution-free. Names no specific predictor; closed by exhibiting any one realization (existence claim).
    undeveloped: false
    formal_object: true
    layer: thesis

  - id: N01-thesis
    type: Goal
    statement: Joint-fit principle — all trust thresholds, gates, and policy parameters must be jointly fit on a single held-out natural-distribution split. Independent fitting voids coverage (cf. the coverage-void result, N03).
    undeveloped: false
    layer: thesis

  - id: N03
    type: Goal
    statement: Coverage void under independent calibration — independent fitting of the conformal abstain rule and the drift detector can simultaneously fire and suppress on the same input, voiding operational coverage. Asserted in the candidacy report; not yet derived from CAN data.
    undeveloped: true                # G1
    layer: thesis

  - id: N19-thesis
    type: Goal
    statement: Constraint-respecting deployable compression — some compression strategy reduces the trained ensemble to a footprint that respects the hardware envelope and per-window latency constraint. Existence claim.
    undeveloped: false
    layer: thesis

  - id: N02-instance
    type: Goal
    statement: Per-class conformal abstain + safety shield + joint apparatus closes the operational rejection guarantee for the candidacy's specific configuration.
    undeveloped: false
    formal_object: true
    layer: instance
    instantiates: N02-thesis

  - id: N01-instance
    type: Goal
    statement: 5-threshold list (tier threshold + 3 runtime gates + conformal alpha) jointly fit on the same held-out natural-distribution split. The candidacy's realization of the joint-fit principle.
    undeveloped: false
    layer: instance
    instantiates: N01-thesis

  - id: N17
    type: Goal
    statement: Per-class conformal abstain — class-conditional conformal predictor on the PINN-active subset.
    undeveloped: false
    formal_object: true
    layer: instance

  - id: N12
    type: Goal
    statement: PINN safety shield projects the simplex so alpha_PINN ≤ lambda_physics(s_t); remaining mass redistributes across {GAT, VGAE, CWD}. One specific instantiation of the decoupled-approval principle.
    undeveloped: false
    formal_object: true
    layer: instance
    instantiates: N31

  - id: N13
    type: Goal
    statement: Composite trust score lambda_physics = lambda_tier × V_regime × V_signal × V_residual; product over three runtime gates with thresholds co-fit on the 5-threshold apparatus.
    undeveloped: false
    formal_object: true
    layer: instance

  - id: N19-instance
    type: Goal
    statement: KD pipeline with ~68× reduction — logit-level + latent-space knowledge distillation; meets the hardware-envelope ceiling at 7 ms per CAN window on Cortex-A7.
    undeveloped: false
    layer: instance
    instantiates: N19-thesis

  - id: N50
    type: Goal
    statement: Per-class abstain rate is operationally bounded under class imbalance. Asserted that the per-class abstain rule's rate on minority attack classes does not dominate; not yet quantified empirically nor reduced via mechanism choice. (Ding et al., OpenReview Dtxc7mlKRg).
    undeveloped: true                # G3
    layer: instance

  # ---- Strategies ----------------------------------------------------------

  - id: S-thesis
    type: Strategy
    statement: A formal class-conditional coverage guarantee (N02-thesis) on a constraint-respecting compressed system (N19-thesis) using diagnostically-orthogonal channels closes the thesis.
    undeveloped: true                # composition theorem not yet written
    open_question: Composition theorem between coverage and compression — does compressing a joint-fitted model preserve class-conditional coverage on the active subset?

  - id: S-N02-thesis
    type: Strategy
    statement: The candidacy's specific configuration closes this abstract guarantee.
    undeveloped: false

  - id: S-N01-thesis
    type: Strategy
    statement: If independent calibration produces a coverage void (cf. the coverage-void result), joint fitting on a single split is the forced fix.
    undeveloped: false

  - id: S-N19-thesis
    type: Strategy
    statement: The KD pipeline realizes this abstract compression requirement.
    undeveloped: false

  - id: S-N02-instance
    type: Strategy
    statement: Composing the per-class abstain rule (N17) with the safety shield (N12) on the joint-fit apparatus (N01-instance) yields a class-conditional rejection bound on the PINN-active subset, conditional on operationally-bounded per-class abstain rate under class imbalance (N50).
    undeveloped: true                # composition proof not yet written
    open_question: Each piece holds individually (N17 from Vovk 2003; N12 implements the decoupled-approval principle; N01-instance conditional on N03; N50 asserted, awaiting empirical bound or mechanism change); the joint argument is the formal contribution of the thesis.

  - id: S-N01-instance
    type: Strategy
    statement: The 5-threshold list is one specific calibration apparatus realizing the joint-fit principle on the natural-distribution split.
    undeveloped: false

  - id: S-N17
    type: Strategy
    statement: Class-conditional conformal predictors with per-class coverage guarantees are standard (Vovk et al. 2003); the kd-gat instantiation specializes to the PINN-active subset.
    undeveloped: false

  - id: S-N12
    type: Strategy
    statement: Implementing the decoupled-approval principle via the composite trust score yields the projection step on the simplex.
    undeveloped: false

  - id: S-N13
    type: Strategy
    statement: lambda_physics is the product lambda_tier × V_regime × V_signal × V_residual; each gate is an empirical runtime check whose validity is definitional. Joint-fit thresholds inherit from the 5-threshold apparatus.
    undeveloped: false

  - id: S-N19-instance
    type: Strategy
    statement: KD capacity-gap literature (Mirzadeh 2020, Zhang 2025) establishes that the ~68× compression ratio falls in the viable region for binary CAN classification because task complexity is bounded. Governed by the hardware-envelope constraint (K1).
    undeveloped: false
    open_question: Teacher-quality vs teacher-size separation not yet experimentally demonstrated.

  # ---- Solutions -----------------------------------------------------------

  - id: N04-instance
    type: Solution
    statement: GAT+VGAE byte-channel + physics chain — the candidacy's specific orthogonal-channel realization. GAT+VGAE reads raw frames; PINN reads physics state via ByCAN. The two branches share no estimation pipeline. Empirical fact about the as-built architecture.
    layer: instance
    instantiates: N04-thesis    # non-conformant annotation; preserves the abstract↔concrete tie

  - id: N31
    type: Solution
    statement: Decoupled approval principle — the signal that evaluates behavior must be independent of the signal that trains it. Goodhart-flavored auxiliary-verification principle.
    citations: [amodei2016concrete, krakovna2020specification, uesato2020decoupled]
    layer: instance

  - id: V03
    type: Solution
    statement: Vovk et al. 2003 — class-conditional conformal predictors with distribution-free per-class coverage guarantees.
    citations: [vovk2003mondrian]
    formal_object: true
    layer: instance

  - id: N20
    type: Solution
    statement: KD capacity-gap law — distillation benefit degrades when the teacher–student gap grows too large; the 68× ratio is viable here because the task is bounded (binary CAN-window classification). Not a universal claim.
    citations: [cho2019efficacy, Mirzadeh-TAKD2020, Towards-Law-of-Capacity-Gap2025]
    formal_object: true
    layer: instance

  - id: N14
    type: Solution
    statement: Regime validity gate V_regime — runtime check whether the current vehicle state is inside the operating regime on which the PINN was trained. Definitional / instrumented.
    layer: instance

  - id: N15
    type: Solution
    statement: Signal reliability gate V_signal — runtime check whether the ByCAN-extracted CAN signals are of sufficient quality. ByCAN signal noise propagates here. Fires on estimator drift.
    layer: instance

  - id: N16
    type: Solution
    statement: Residual uncertainty gate V_residual — runtime check whether the PINN's residual uncertainty is tight enough to be informative. Fires on over-wide uncertainty.
    layer: instance

  # ---- Contexts ------------------------------------------------------------

  - id: N04-thesis
    type: Context
    statement: Channel-disagreement principle — heterogeneous channels with non-overlapping estimation pipelines produce diagnostic disagreement on attack inputs. Empirical, not a theorem; structural prerequisite for any ensemble-as-arbitration design.
    layer: thesis

  - id: K1
    type: Context
    statement: Hardware envelope — ARM Cortex-A7/A53; 256–512 MB RAM; <100 mW; <50–100 ms latency; 173K FP32 parameter ceiling at 7 ms per CAN window.
    layer: constraint

  - id: K-regulatory
    type: Context
    statement: Regulatory constraints — ISO 26262 ASIL C/D (Part 6) requires structural code coverage, bidirectional V-model traceability, and FFI evidence for mixed-criticality ECUs; black-box models cannot supply these. ISO/PAS 8800:2024 mandates runtime monitor and OOD detection. UN R155 §7.3.7 mandates vehicle-resident IDS for EU type-approval (since 07/2022; all new EU vehicles since 07/2024).
    citations: [iso26262_part6, iso8800, unece_r155]
    layer: constraint

  - id: K-operational
    type: Context
    statement: Operational constraints — (K5) CAN protocol lacks authentication; injected frames are indistinguishable at the protocol level. (K6) Detection is per-CAN-window (W=100 messages, ~1 ms). (K7) Severe class imbalance 36:1–927:1 forces class-conditional evaluation. (K8) ByCAN recovers ~80% slicing / ~69% labeling accuracy; tier-3 noise on physical-state extraction. (K9) Cross-vehicle generalization is declared orthogonal future work.
    citations: [fpga_ids_ecu_2024, real_time_zero_day_fpga_2024, bycan_2024, iv_ids_survey_2025]
    layer: constraint

