name: Paper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.10.4" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - uses: quarto-dev/quarto-actions/setup@v2
        with: { version: "1.8.2" }

      - run: uv sync --frozen --extra notebooks --group dev

      - name: Validate
        run: |
          uv run python tools/validate/inputs/data.py
          uv run python tools/validate/inputs/bib.py

      - name: Build figures
        run: cd interactive && bun install --frozen-lockfile && bun run build

      - name: Build tables
        run: uv run python tools/tables/build.py

      - name: Render Quarto book
        run: quarto render

      - name: Copy figures and slides into site
        run: |
          mkdir -p _build/site/assets/html/submission _build/site/slides
          cp _build/figures/*.html _build/site/assets/html/submission/
          uv run python tools/slides/build.py presentations/candidacy.md _build/slides
          cp _build/slides/candidacy.html _build/site/slides/

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v4
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with: { path: _build/site/ }
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: deploy
        uses: actions/deploy-pages@v4
