name: Paper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml bibtexparser==2.0.0b9
      - run: python tools/validate/inputs/data.py
      - run: python tools/validate/inputs/bib.py

  # Fast TMLR-converter regression check, parallel to validate. Fails fast on
  # paper-content edits that would break the load-bearing AST serializer.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: cd tools/tmlr && bun install --frozen-lockfile && bun test

  figures:
    runs-on: ubuntu-latest
    needs: [validate, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: cd interactive && bun install --frozen-lockfile && bun run build
      - uses: actions/upload-artifact@v4
        with: { name: figures, path: "_build/figures/*.html" }

  # Build MyST site AST + TMLR exports (shared by deploy-pages and tmlr-submission)
  build:
    runs-on: ubuntu-latest
    needs: figures
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: figures, path: _build/figures/ }

      - run: pip install pyyaml polars great-tables
      - name: Build tables
        run: python tools/tables/build.py
      - name: Build MyST AST
        run: bun install -g mystmd@1.8.3 && myst build --site
      - name: Install TMLR serializer deps
        run: cd tools/tmlr && bun install --frozen-lockfile
      - name: Build TMLR submission (public)
        run: cd tools/tmlr && bun build.mjs --output ../../_build/submission/
      - name: Merge with TMLR author kit
        run: |
          cp _build/submission/submission.md tmlr_do_not_modify/_under_review/submission.md
          cp -r _build/submission/assets/* tmlr_do_not_modify/assets/ 2>/dev/null || true

      # Build anonymous submission artifact
      - name: Build TMLR submission (anonymous)
        if: github.ref == 'refs/heads/main'
        run: cd tools/tmlr && bun build.mjs --output ../../_build/submission_anon/ --anonymous
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { name: tmlr-submission, path: _build/submission_anon/ }

      # Upload merged author kit for deploy-pages
      - uses: actions/upload-artifact@v4
        with: { name: tmlr-site, path: tmlr_do_not_modify/ }

  # ---- Deploy jobs (main branch only, run in parallel) ----

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: tmlr-site, path: tmlr_do_not_modify/ }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }
      - name: Build Jekyll site
        run: |
          cd tmlr_do_not_modify
          bundle install
          bundle exec jekyll build --baseurl "/kd-gat-paper"
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: tmlr_do_not_modify/_site/ }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  candidacy-site:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: figures
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/download-artifact@v4
        with: { name: figures, path: _build/figures/ }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml polars great-tables
      - name: Deploy candidacy to curve.space
        env:
          CURVENOTE_TOKEN: ${{ secrets.CURVENOTE_TOKEN }}
        run: |
          cp myst.yml myst.yml.paper
          cp myst.candidacy.yml myst.yml
          trap 'mv myst.yml.paper myst.yml' EXIT
          python tools/tables/build.py
          # Bundle CSS files into a single file referenced by site.options.style
          # (article-theme only accepts a single `style: <file>`, not a `css:` list).
          cat _static/custom.css _static/story.css > _static/site.bundle.css
          bun install -g mystmd@1.8.3
          bunx -y curvenote@0.14.3 deploy --yes
