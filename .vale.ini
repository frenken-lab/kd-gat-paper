StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = MLPaper

Packages = Microsoft

[*.md]
BasedOnStyles = Vale, MLPaper, Microsoft

# Vale.Terms — case-substitution rule collides with the modal verb "can"
# because CAN (the bus) is in Vocab. False positives on every "we can show",
# "can be trusted", etc.
Vale.Terms = NO

# Microsoft style is built for product docs, not academic papers. Disable
# the rules that fight TMLR / scientific-writing convention head-on:
#   We — Microsoft says "avoid first-person plural"; ML papers use "we" by
#        convention.
#   Contractions — Microsoft prefers contractions; academic writing avoids
#        them.
#   Semicolon — Microsoft flags every semicolon; academic prose uses them
#        freely for parallel clauses.
#   Passive — generic noisy passive-voice flag; produces mostly false
#        positives on technical claims ("X is computed by Y").
Microsoft.We = NO
Microsoft.Contractions = NO
Microsoft.Semicolon = NO
Microsoft.Passive = NO

# MyST roles and directives confuse Vale's tokenizer.
# Skip inline roles like {cite:p}`key`, {ref}`label`, {eq}`label`, {numref}`fig:x`,
# plus inline math ($...$) so symbols and bibkeys don't trip prose rules.
TokenIgnores = (\{[a-z:]+\}`[^`]+`), (`[^`]+`\{[a-z:]+\}), (\$[^$\n]+\$)

# Skip MyST directive blocks (```{directive} ... ```) and display math ($$...$$).
BlockIgnores = (?s)( *```\{[a-z-]+\}.*?\n```), (?s)(\$\$.+?\$\$)

# Don't lint vendored TMLR kit, generated build output, or the candidacy
# committee-question files (those have their own STYLE.md-based audit).
[paper/{content,candidacy}/**.md]
BasedOnStyles = Vale, MLPaper, Microsoft
Vale.Terms = NO
Microsoft.We = NO
Microsoft.Contractions = NO
Microsoft.Semicolon = NO
Microsoft.Passive = NO

[tmlr_do_not_modify/**]
BasedOnStyles =

[_build/**]
BasedOnStyles =
