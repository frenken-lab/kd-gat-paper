StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = MLPaper

Packages = proselint, write-good

[*.md]
BasedOnStyles = Vale, MLPaper, proselint, write-good

# MyST roles and directives confuse Vale's tokenizer.
# Skip inline roles like {cite:p}`key`, {ref}`label`, {eq}`label`, {numref}`fig:x`,
# plus inline math ($...$) so symbols and bibkeys don't trip prose rules.
TokenIgnores = (\{[a-z:]+\}`[^`]+`), (`[^`]+`\{[a-z:]+\}), (\$[^$\n]+\$)

# Skip MyST directive blocks (```{directive} ... ```) and display math ($$...$$).
BlockIgnores = (?s)( *```\{[a-z-]+\}.*?\n```), (?s)(\$\$.+?\$\$)

# Don't lint vendored TMLR kit, generated build output, or the candidacy
# committee-question files (those have their own STYLE.md-based audit).
[paper/{content,candidacy}/**.md]
BasedOnStyles = Vale, MLPaper, proselint, write-good

[tmlr_do_not_modify/**]
BasedOnStyles =

[_build/**]
BasedOnStyles =
