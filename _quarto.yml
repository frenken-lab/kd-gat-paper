project:
  type: book
  output-dir: _build/site

book:
  title: "Adaptive Fusion of Graph-Based Ensembles for Automotive Intrusion Detection"
  subtitle: "PhD Candidacy Report"
  author:
    - name: Robert Frenken
      affiliation: The Ohio State University
  date: today
  search: true
  repo-url: https://github.com/frenken-lab/kd-gat-paper
  repo-actions: [edit, source]
  page-navigation: true
  chapters:
    - index.qmd
    - part: "Current Framework"
      chapters:
        - paper/candidacy/introduction.qmd
        - paper/content/background.qmd
        - paper/candidacy/background.qmd
        - paper/content/related-work.qmd
        - paper/content/methodology.qmd
        - paper/content/experiments.qmd
        - paper/content/results.qmd
        - paper/content/ablation.qmd
        - paper/content/explainability.qmd
    - part: "Proposed Research"
      chapters:
        - paper/candidacy/proposed-research.qmd
        - paper/candidacy/broader-impact.qmd
    - part: "Committee Questions"
      chapters:
        - paper/candidacy/committee-questions/index.qmd
    - paper/candidacy/committee-questions/physics-dynamics.qmd
    - paper/candidacy/committee-questions/interpretability-calibration.qmd
    - paper/candidacy/committee-questions/federated-optimization.qmd
    - paper/candidacy/committee-questions/reinforcement-learning.qmd
    - paper/content/conclusion.qmd
  appendices:
    - paper/candidacy/appendix.qmd
    - paper/content/appendix/architecture.qmd
    - paper/content/appendix/figures.qmd

bibliography:
  - paper/references/own.bib
  - paper/references/can_ids.bib
  - paper/references/gnn.bib
  - paper/references/kd.bib
  - paper/references/rl.bib
  - paper/references/vgae.bib
  - paper/references/datasets.bib
  - paper/references/curriculum.bib
  - paper/references/cross_domain.bib
  - paper/references/infrastructure.bib
  - paper/references/background.bib
  - paper/references/loss.bib
  - paper/references/candidacy.bib

crossref:
  fig-prefix: "Fig."
  tbl-prefix: "Tbl."
  eq-prefix: "Eq."
  sec-prefix: "Sec."
  chapters: true

format:
  html:
    theme: cosmo
    css: _static/quarto.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-copy: true
    code-fold: false
    fig-responsive: true
    link-external-icon: true
    link-external-newwindow: true

execute:
  freeze: auto
  echo: false
