<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Distill Preview · kd-gat-paper</title>
<script src="/distillpub/template.v2.js"></script>
<style>
  /* Match Distill's main column. The kit's main.css ships Jekyll-coupled
     selectors that don't load cleanly without Liquid; this is the minimum
     to make column width and figure sizing honest. */
  body {
    font-family: 'Source Serif Pro', 'Times New Roman', serif;
    line-height: 1.6;
    color: rgba(0,0,0,0.8);
    margin: 0;
    background: #fff;
  }
  d-article {
    display: block;
    padding: 2rem 0 6rem;
  }
  d-article > * {
    grid-column: text;
  }
  d-article h1, d-article h2, d-article h3, d-article h4 {
    font-family: 'Source Sans Pro', system-ui, sans-serif;
  }
  d-article p { font-size: 1.06rem; }
  d-article pre {
    background: #f6f8fa;
    padding: 0.6rem 0.8rem;
    border-radius: 4px;
    overflow-x: auto;
    font-size: 0.92rem;
  }
  d-article code { font-size: 0.92rem; }
  d-article iframe {
    width: 100%;
    border: none;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  d-article figure { margin: 2rem 0; }
  d-article figcaption {
    font-size: 0.92rem;
    color: rgba(0,0,0,0.6);
    margin-top: 0.4rem;
  }
  d-article table { border-collapse: collapse; margin: 1.5rem 0; }
  d-article table th, d-article table td {
    border-bottom: 1px solid #e5e5e5;
    padding: 0.4rem 0.8rem;
    text-align: left;
  }
  d-article d-cite { color: hsl(206, 90%, 35%); }
  /* Show a pulse when a rebuild lands. */
  .reload-flash { animation: flash 0.4s ease-out; }
  @keyframes flash { from { background: #fff8c5; } to { background: transparent; } }
  #status {
    position: fixed;
    top: 0.5rem;
    right: 0.5rem;
    font: 11px/1 ui-monospace, monospace;
    color: #888;
    background: rgba(255,255,255,0.85);
    padding: 0.3rem 0.5rem;
    border-radius: 3px;
    border: 1px solid #eee;
  }
</style>
</head>
<body>
<div id="status">loading…</div>
<d-front-matter></d-front-matter>
<d-title><h1>Distill layout preview</h1>
<p style="color:#888">Auto-reloads on save. <code>d-cite</code> renders as <code>[key]</code>; bib not resolved. This preview is for layout, not for citation accuracy.</p>
</d-title>
<d-article id="article"><p style="color:#888">Fetching submission.md…</p></d-article>

<script type="module">
import markdownit from 'https://esm.sh/markdown-it@14';

const status = document.getElementById('status');
const article = document.getElementById('article');
const md = markdownit({ html: true, linkify: true, typographer: true });

// Strip YAML frontmatter delimited by --- ... ---.
function stripFrontmatter(src) {
  if (!src.startsWith('---')) return src;
  const end = src.indexOf('\n---', 3);
  if (end < 0) return src;
  return src.slice(end + 4).replace(/^\n+/, '');
}

// Replace Jekyll Liquid {{ '<path>' | relative_url }} → /<path>.
// build.mjs emits this only inside iframe/img/embed src= attrs.
function stripLiquid(src) {
  return src.replace(/\{\{\s*'([^']+)'\s*\|\s*relative_url\s*\}\}/g, '/$1');
}

// $$...$$ display math fences confuse markdown-it; pull them out and
// render as <d-math block> so MathJax-via-Distill can pick them up.
// $...$ inline → <d-math>...</d-math>.
function protectMath(src) {
  return src
    .replace(/\$\$\n?([\s\S]+?)\n?\$\$/g, (_, m) => `\n\n<d-math block>${m.trim()}</d-math>\n\n`)
    .replace(/(?<![\\$])\$([^$\n]+)\$/g, (_, m) => `<d-math>${m}</d-math>`);
}

async function render() {
  status.textContent = 'fetching…';
  const res = await fetch(`/submission.md?v=${Date.now()}`);
  if (!res.ok) {
    article.innerHTML = `<p style="color:#c33">submission.md not found (${res.status}). Run <code>myst build --site</code> first.</p>`;
    status.textContent = 'no source';
    return;
  }
  let src = await res.text();
  src = stripFrontmatter(src);
  src = stripLiquid(src);
  src = protectMath(src);
  article.innerHTML = md.render(src);
  article.classList.remove('reload-flash');
  void article.offsetWidth;
  article.classList.add('reload-flash');
  status.textContent = `rendered ${(src.length/1024).toFixed(1)} kB`;
}

await render();

// Live reload via SSE.
const sse = new EventSource('/sse');
let lastVersion = null;
sse.addEventListener('message', (ev) => {
  const v = ev.data;
  if (lastVersion !== null && v !== lastVersion) render();
  lastVersion = v;
});
sse.addEventListener('error', () => { status.textContent = 'sse disconnected'; });
</script>
</body>
</html>
