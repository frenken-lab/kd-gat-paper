# Install: uv tool install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tmlr_do_not_modify/
      - id: end-of-file-fixer
        exclude: ^tmlr_do_not_modify/
      - id: check-yaml
        exclude: ^tmlr_do_not_modify/
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^tmlr_do_not_modify/

  - repo: local
    hooks:
      # tools/tmlr/build.mjs serializes MyST mdast → Distill markdown via
      # mdast-util-to-markdown defaultHandlers + Distill-flavored overrides.
      # Re-run its semantic-property tests whenever the converter changes.
      - id: tmlr-tests
        name: tmlr serializer tests (bun test)
        language: system
        entry: bash -c 'cd tools/tmlr && bun test'
        files: '^tools/tmlr/.*\.mjs$'
        pass_filenames: false

      - id: validate-bib
        name: validate bibliography
        language: system
        entry: uv run python tools/validate/inputs/bib.py
        files: '^paper/references/.*\.bib$'
        pass_filenames: false

      - id: validate-data
        name: validate data schemas
        language: system
        entry: uv run python tools/validate/inputs/data.py
        files: '^(data/csv/.*\.csv|data/schemas\.yaml)$'
        pass_filenames: false

      - id: eslint
        name: eslint (interactive)
        language: system
        entry: bash -c 'cd interactive && bunx eslint --max-warnings=0 src/'
        files: '^interactive/src/.*\.(ts|js|svelte)$'
        pass_filenames: false

      - id: prettier
        name: prettier (interactive)
        language: system
        entry: bash -c 'cd interactive && bunx prettier --check src/'
        files: '^interactive/src/'
        pass_filenames: false
