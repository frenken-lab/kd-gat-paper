# Install: uv tool install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: validate-bib
        name: validate bibliography
        language: system
        entry: uv run python tools/validate_inputs.py --bib-only
        files: '^paper/references/.*\.bib$'
        pass_filenames: false

      - id: validate-data
        name: validate data schemas
        language: system
        entry: uv run python tools/validate_inputs.py --data-only
        files: '^(data/csv/.*\.csv|data/schemas\.yaml)$'
        pass_filenames: false

      - id: eslint
        name: eslint (interactive)
        language: system
        entry: bash -c 'cd interactive && bunx eslint --max-warnings=0 src/'
        files: '^interactive/src/.*\.(ts|js|svelte)$'
        pass_filenames: false

      - id: prettier
        name: prettier (interactive)
        language: system
        entry: bash -c 'cd interactive && bunx prettier --check src/'
        files: '^interactive/src/'
        pass_filenames: false
